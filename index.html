<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Clock</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">

  <div class="text-center space-y-6">
    <!-- التاريخ -->
    <div id="dateDisplay" class="text-slate-400 text-sm md:text-lg font-medium tracking-widest uppercase">
      Loading date...
    </div>

    <!-- الساعة الرقمية الرئيسية -->
    <div class="bg-slate-900/80 border border-slate-800 rounded-3xl p-8 md:p-12 shadow-2xl backdrop-blur">
      <div id="timeDisplay" class="font-mono font-bold text-5xl sm:text-7xl md:text-8xl tracking-tight text-white">
        00:00:00
      </div>
      <div id="ampmDisplay" class="font-mono text-emerald-400 text-sm md:text-base font-semibold mt-2 tracking-widest">
        --
      </div>
    </div>

    <!-- مؤشر النبض الحي -->
    <div class="flex items-center justify-center gap-2 text-xs text-slate-500 font-mono">
      <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
      <span>LIVE TIME TICKER</span>
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();

      // تنسيق الوقت
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';

      // تحويل لنظام 12 ساعة
      hours = hours % 12;
      hours = hours ? hours : 12; // 0 تصبح 12
      const formattedHours = String(hours).padStart(2, '0');

      document.getElementById('timeDisplay').innerText = `${formattedHours}:${minutes}:${seconds}`;
      document.getElementById('ampmDisplay').innerText = ampm;

      // تنسيق التاريخ بالكامل
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('dateDisplay').innerText = now.toLocaleDateString('en-US', options);
    }

    // تحديث فوري ثم كل ثانية
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
